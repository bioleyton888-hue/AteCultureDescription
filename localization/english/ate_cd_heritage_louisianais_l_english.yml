 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Cajun?oldid=2903
 ate_cd_cajun_desc:0 "This southern people makes its home in the bayous of Louisiane. Having been forced out of eastern Canada in ancient times, the Cadjins have mingled with the Creole people of Louisiana for centuries. Western Cadjins chiefly adhere to the Voodoo faith, while the traditionalist East follows the Catholic pope in New Rome."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Creole?oldid=2905
 ate_cd_creole_desc:0 "This unique people, descended from French, Afro-Caribbean and Cadjin cultures, dwell at the mouth of the Mississippi, among the swampy flooded remains of New Orleans. They mostly follow the cult of Voodoo."
