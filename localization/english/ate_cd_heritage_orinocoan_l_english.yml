 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Lokono?oldid=3182
 ate_cd_lokono_desc:0 "As with many indigenous groups, when colonizers appeared to the Arawak people, they were presented with a choice: resist or cooperate. While their cousins, the Wayuu, famously fought back against their overlords with their own weapons, the Lokono (meaning \"many people\") chose to accept and trade with the Spaniards. While they still ended up as ill-treated servants, they were prosperous compared to other tribes along the Orinoco."
