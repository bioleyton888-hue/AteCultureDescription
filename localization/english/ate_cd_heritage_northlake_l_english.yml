l_english:
 # Written by meanderingSquid49 (community spreadsheet)
 ate_cd_minnesotan_desc:0 "The men and women of Old Minnesota's fertile south are a humble, modest people, but firm in their convictions and with a quiet pride in their clan and kin. Before the Event, the great city of Minneapolis attracted many different peoples, ready to endure its harsh winters in search of a better life, and Minnesotan oral tradition is still filled with legends of resilience and endurance."
 # Written by meanderingSquid49 (community spreadsheet)
 ate_cd_northlander_desc:0 "The harsh northern woods of Old Minnesota are inhabited by those up to the task of surviving in the frigid forests and harsh hills. Even before the End, the Northlanders prided themselves as descendants of miners, woodsmen, and other self-reliant folk. Now they are found as merchants, mercenaries, and pirates alike all along the coasts of the Great Lakes."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Yooper?oldid=2762
 ate_cd_yooper_desc:0 "The Upper Peninsula had never truly urbanized, and the unique culture that emerged there only strengthened after the Event. The bitter cold brought by the Great Lakes has stifled true prosperity, with many small tribes of the Norse faith dotted along the lakeside coast."
