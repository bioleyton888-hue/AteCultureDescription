l_english:
 # Generic descriptions by heritage family (scripts/heritage_families.txt).
 # base = original ATE culture without a written description; hybrid/divergent = cultures created in game.
 # Amazonia & native Brazil
 ate_cd_generic_amazonian_base_desc:0 "The [Culture.GetCollectiveNounNoTooltip] are children of the great rivers, peoples for whom the forest was never a frontier but a home. When the Event swallowed the cities of the coast, the canopy barely noticed, and neither did they. They measure wealth in kin, in rivers known and in stories kept, and they guard all three jealously."
 ate_cd_generic_amazonian_hybrid_desc:0 "The [Culture.GetCollectiveNounNoTooltip] were born where two peoples of the forest shared the same rivers long enough to share everything else. Their villages keep the customs of both parents, often argued over and rarely abandoned. To outsiders they look like one people; among themselves the old seams are a favorite topic of gossip."
 ate_cd_generic_amazonian_divergent_desc:0 "The [Culture.GetCollectiveNounNoTooltip] broke away from their kin somewhere upriver, where distance and the forest turned small differences into a new way of life. They still share songs and ancestors with the people they left behind. They simply no longer agree on which version of those songs is the right one."
 # Andes & northern South America
 ate_cd_generic_andean_base_desc:0 "The [Culture.GetCollectiveNounNoTooltip] live between mountain and sky, in lands where every field was carved out of a slope by someone's grandmother. The ruins of the old republics lie all around them, but the terraces, the herds and the saints outlived them all. Patient and stubborn, they know the mountain always wins in the end, and they intend to be standing beside it when it does."
 ate_cd_generic_andean_hybrid_desc:0 "The [Culture.GetCollectiveNounNoTooltip] arose where highland and lowland peoples met in the markets and stayed for the weddings. They speak with borrowed words, pray to borrowed saints and swear by borrowed ancestors, and they are proud of every one. Their neighbors call them confused; they call themselves the only ones who got the best of both."
 ate_cd_generic_andean_divergent_desc:0 "The [Culture.GetCollectiveNounNoTooltip] split from their parent people in some high valley, after a quarrel over land, a saint or a chieftain that nobody remembers clearly anymore. What began as a feud hardened into customs, dialect and pride. Today they insist they were always different, and they have the terraces to prove it."
 # North & Arctic
 ate_cd_generic_arctic_base_desc:0 "The [Culture.GetCollectiveNounNoTooltip] are a people of ice, tundra and endless forest, living where the reach of the old world was always thinnest. The Event hardly changed their winters, though it emptied the towns that once bothered them. Hardy and resourceful, they know exactly how much a mistake costs in the north, and they rarely make one twice."
 ate_cd_generic_arctic_hybrid_desc:0 "The [Culture.GetCollectiveNounNoTooltip] were born where northern peoples shared hunting grounds, trading posts and hard winters until they became one. Their customs combine the lore of both parents into a single way of surviving. In a land this empty, they reason, nobody can afford to stay strangers."
 ate_cd_generic_arctic_divergent_desc:0 "The [Culture.GetCollectiveNounNoTooltip] broke away from their kin after following the herds, the fish or a stubborn elder into a new corner of the north. Distance and cold did the rest. They still share stories with their parent people, and usually disagree on how they end."
 # Brazil
 ate_cd_generic_brazilian_base_desc:0 "The [Culture.GetCollectiveNounNoTooltip] are heirs to the sprawling land that once called itself Brazil, a country too big to collapse all at once. Its cities fell, but its festivals, its saints and its talent for making do survived in every backland and bay. Loud, devout and endlessly inventive, they treat hardship as one more reason to throw a party."
 ate_cd_generic_brazilian_hybrid_desc:0 "The [Culture.GetCollectiveNounNoTooltip] were born of two peoples who traded, married and feuded until nobody could tell where one ended and the other began. Their music, food and prayers are a patchwork that somehow always sounds complete. They like to say that mixing is the oldest tradition in the land, and they may well be right."
 ate_cd_generic_brazilian_divergent_desc:0 "The [Culture.GetCollectiveNounNoTooltip] drifted away from their kin as the roads between them fell apart and each town learned to fend for itself. Over generations their accent, their saints and their feasts grew into something of their own. They still visit the old homeland for its festivals, mostly to point out everything it does wrong."
 # Canada
 ate_cd_generic_canadian_base_desc:0 "The [Culture.GetCollectiveNounNoTooltip] are a northern people shaped by long winters, wide rivers and the habit of waiting out whatever comes. When the southern powers tore themselves apart, the north endured quietly, as it always had. Polite to strangers and unbending among themselves, they keep their word and their firewood dry."
 ate_cd_generic_canadian_hybrid_desc:0 "The [Culture.GetCollectiveNounNoTooltip] were born where two northern peoples shared the same hard winters until they shared a hearth. Their tongue slides between old languages in the middle of a sentence, and their customs belong to both sides of the family. Outsiders find them hard to pin down, which suits them perfectly."
 ate_cd_generic_canadian_divergent_desc:0 "The [Culture.GetCollectiveNounNoTooltip] broke away from their kin across some lake, river or stretch of snow that proved wider than kinship. Isolation did the rest, turning a few odd habits into a way of life. They still call their parent people cousins, though rarely in a tone anyone would call warm."
 # Caribbean & the Guianas
 ate_cd_generic_caribbean_base_desc:0 "The [Culture.GetCollectiveNounNoTooltip] are a people of the sea, scattered across islands and coasts where the storms have always had the final word. Sugar empires, republics and the Event itself have washed over them like the tide and gone. What remains is a fierce, musical folk who trust the sea more than any crown."
 ate_cd_generic_caribbean_hybrid_desc:0 "The [Culture.GetCollectiveNounNoTooltip] were born in the harbors, where sailors, traders and exiles from different shores stayed long enough to become one people. Their language is a sailor's patchwork and their faith a crowded altar. They consider every newcomer a future relative, as long as the newcomer can dance."
 ate_cd_generic_caribbean_divergent_desc:0 "The [Culture.GetCollectiveNounNoTooltip] set out from the shores of their kin and never quite came back, founding their own ways on distant islands and forgotten coasts. The sea gave them room to become someone else. They still trade with the old homeland, and still haggle as if they had never been family."
 # Central America
 ate_cd_generic_central_american_base_desc:0 "The [Culture.GetCollectiveNounNoTooltip] live on the narrow bridge between two continents, among volcanoes, jungles and the ruins of a canal that once carried the trade of the world. Every empire of the old age passed through their land and none of them stayed. They are practical, hospitable and deeply suspicious of anyone who arrives carrying a flag."
 ate_cd_generic_central_american_hybrid_desc:0 "The [Culture.GetCollectiveNounNoTooltip] were born where the peoples of the isthmus crossed paths too often to stay apart. Their customs mix the mountain and the coast, the jungle and the port. They are living proof that the crossroads of the world can still make something new."
 ate_cd_generic_central_american_divergent_desc:0 "The [Culture.GetCollectiveNounNoTooltip] broke away from their kin in some valley between two volcanoes, where the old ways had to bend to survive. Generations later, the bend became a break. They still share festivals with the people they left behind, though never the same recipes."
 # Native Mesoamerica
 ate_cd_generic_mesoamerican_base_desc:0 "The [Culture.GetCollectiveNounNoTooltip] are an old people, far older than the Event and older still than the empires that came before it. Their languages outlived conquest, the republics and the collapse of the modern world. Rooted in maize, mountain and memory, they do not ask whether their ways will survive, only how."
 ate_cd_generic_mesoamerican_hybrid_desc:0 "The [Culture.GetCollectiveNounNoTooltip] were born where two of the ancient peoples of the land shared valleys, markets and marriages until their lines became one. Their rites braid together gods, saints and ancestors from both sides. They say the old world was always a meeting of peoples, and they are simply carrying it on."
 ate_cd_generic_mesoamerican_divergent_desc:0 "The [Culture.GetCollectiveNounNoTooltip] split from their kin in some far valley, where old rites took new forms under a new generation of elders. What was once a local custom became the pride of a nation. Their parent people still recognize them as family, though they no longer understand half their jokes."
 # Mexico
 ate_cd_generic_mexican_base_desc:0 "The [Culture.GetCollectiveNounNoTooltip] are heirs to the old heartland of Mexico, from the northern deserts to the southern highlands. The great cities emptied and the old state crumbled, but the markets, the saints and the family feasts never missed a year. Proud, stubborn and fiercely loyal to kin, they believe a people is measured by who still sits at its table."
 ate_cd_generic_mexican_hybrid_desc:0 "The [Culture.GetCollectiveNounNoTooltip] were born where northern and southern ways met, mixed and argued over dinner. Their dialect is full of borrowed words and their altars full of borrowed saints. They see nothing strange in having two sets of ancestors, only twice as many people to honor."
 ate_cd_generic_mexican_divergent_desc:0 "The [Culture.GetCollectiveNounNoTooltip] broke away from their kin when the roads grew too long and the local bosses too powerful to ignore. In isolation their speech, food and festivals drifted into something of their own. They still claim the glories of the old homeland, just not its people."
 # Native peoples of the East & the Plains
 ate_cd_generic_native_eastern_base_desc:0 "The [Culture.GetCollectiveNounNoTooltip] belong to the nations of the east and the great plains, peoples who endured the old republic and outlived it. When its cities fell, they reclaimed the rivers, forests and grasslands their ancestors never truly surrendered. Bound by kinship, council and memory, they remember every treaty ever broken, and every one ever kept."
 ate_cd_generic_native_eastern_hybrid_desc:0 "The [Culture.GetCollectiveNounNoTooltip] were born of two nations that hunted, traded and fought side by side until they chose to become one people. Their councils speak with both tongues and honor both lines of ancestors. They consider the union a treaty of their own, and they intend to keep it better than the old ones were kept."
 ate_cd_generic_native_eastern_divergent_desc:0 "The [Culture.GetCollectiveNounNoTooltip] broke away from their nation to follow a new leader, a new land or a new vision of the old ways. Time turned the band into a people and the wandering into a homeland. They still sit at the same councils as their kin, though rarely on the same side."
 # Native peoples of the West & the Pacific
 ate_cd_generic_native_western_base_desc:0 "The [Culture.GetCollectiveNounNoTooltip] belong to the peoples of the west, from the salmon rivers and cedar coasts to the mesas and dry basins. They watched the towns of the old nation fill the land, and then watched the land take them back. Patient and deeply rooted, they live by the knowledge that a place remembers everyone who ever lived in it."
 ate_cd_generic_native_western_hybrid_desc:0 "The [Culture.GetCollectiveNounNoTooltip] were born where two western peoples shared rivers, canyons or coastlines long enough to share their lives. Their songs, crafts and ceremonies weave both inheritances together. To them the mixing is not a loss but a new thread in a very old weave."
 ate_cd_generic_native_western_divergent_desc:0 "The [Culture.GetCollectiveNounNoTooltip] broke away from their kin to settle a new valley, river or stretch of coast, and the land slowly remade them. New places brought new ceremonies and new names. They remain family to their parent people, if family who visit only for the important feasts."
 # Northeast & Great Lakes
 ate_cd_generic_northeastern_base_desc:0 "The [Culture.GetCollectiveNounNoTooltip] live in the old heart of industry, among great lakes, rusting cities and the bones of factories that once fed the world. The Event turned their towers into quarries and their highways into pilgrim roads. Hard-working and stubborn, they rebuild on the ruins of their ancestors and never stop complaining about it."
 ate_cd_generic_northeastern_hybrid_desc:0 "The [Culture.GetCollectiveNounNoTooltip] were born where the peoples of the old industrial north mixed in the markets, mills and parishes until they became one. Their speech is thick with borrowed words and their holidays come from both sides of the family. They see themselves as the rightful heirs of every ruined city around them, whichever parent once ruled it."
 ate_cd_generic_northeastern_divergent_desc:0 "The [Culture.GetCollectiveNounNoTooltip] broke away from their kin when their town, valley or lakeshore decided it had had enough of distant rulers. What began as a local grudge became an accent, a set of customs and eventually a people. They still follow the news of their parent people closely, mostly so they can disapprove of it."
 # Southern US
 ate_cd_generic_southern_base_desc:0 "The [Culture.GetCollectiveNounNoTooltip] are children of the American South, a land of swamps, bayous, red hills and hurricanes. The old nation fell around them, but the storms, the stubbornness and the cooking all survived. Proud, hospitable and quick to take offense, they will feed any stranger and fight any fool."
 ate_cd_generic_southern_hybrid_desc:0 "The [Culture.GetCollectiveNounNoTooltip] were born where southern peoples lived side by side long enough to marry, trade and eventually stop telling each other apart. Their speech, food and faith borrow freely from both parents. They insist the mixture only made them more southern, and nobody has dared to argue."
 ate_cd_generic_southern_divergent_desc:0 "The [Culture.GetCollectiveNounNoTooltip] broke away from their kin somewhere in the swamps, hills or plains of the South, when an old grudge finally outgrew the family. In time their accent drifted and their customs followed. They still share the same storms as their parent people, and they blame each other for every one of them."
 # Southern Cone
 ate_cd_generic_southern_cone_base_desc:0 "The [Culture.GetCollectiveNounNoTooltip] live at the far end of the world, among the pampas, the southern mountains and the windswept coasts of Patagonia. Too far from everything for the fall of the old world to reach them all at once, they had time to adapt, and they did. Tough, proud and fond of long arguments over longer meals, they fear little except the wind."
 ate_cd_generic_southern_cone_hybrid_desc:0 "The [Culture.GetCollectiveNounNoTooltip] were born where the peoples of the south shared the same plains, mountain passes and river trade until they became one. Their customs blend horse and field, mountain and coast. They consider their mixed heritage the only fitting answer to such a vast and empty land."
 ate_cd_generic_southern_cone_divergent_desc:0 "The [Culture.GetCollectiveNounNoTooltip] broke away from their kin somewhere across the endless plains or beyond a mountain pass, where distance proved stronger than blood. Isolation turned small differences into proud traditions. They still share the old songs with their parent people, and still argue about who sings them better."
 # Western US
 ate_cd_generic_western_base_desc:0 "The [Culture.GetCollectiveNounNoTooltip] are heirs to the old American West, from the Pacific coast to the deserts and the great mountains. Its glittering cities fell to drought, quake and the Event, but its people have always been good at starting over. Restless and self-reliant, they believe a person is defined by what they build, not by what they inherit."
 ate_cd_generic_western_hybrid_desc:0 "The [Culture.GetCollectiveNounNoTooltip] were born where western peoples met on the trails, in the valleys and in the mining towns, and decided to stay together. Their customs are a frontier mix of everything that ever passed through. They see themselves as the latest proof that the West was always a place for new beginnings."
 ate_cd_generic_western_divergent_desc:0 "The [Culture.GetCollectiveNounNoTooltip] broke away from their kin by crossing one more mountain range or desert than anyone else was willing to. On the far side, they built their own towns, laws and habits. Their parent people still call them wanderers; they call themselves the ones who kept going."
