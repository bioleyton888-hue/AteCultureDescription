 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Istme%C3%B1o?oldid=3127
 ate_cd_istmeno_desc:0 "The Istmeño people are the descendants of the Panamanians who inhabit the eponymous Isthmus, from which the term Istmeño derives. One of the only cultures with access to both the Pacific and Atlantic Oceans, the Istmeño have strong mercantile traditions, with the portage across what was once the Panama Canal being an extremely lucrative trade route."
