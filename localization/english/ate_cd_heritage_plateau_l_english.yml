 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Apache?oldid=3030
 ate_cd_apache_desc:0 "The Apache were famed for their fierceness in battle and cunning in strategy. Several deadly raiding campaigns cemented their legacy in the American psyche. Today, they are unique in that they are the only Southwestern tribe to have adopted the Atomicist religion, rather than follow the Mormon faith of Salt Lake."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Hopi?oldid=3032
 ate_cd_hopi_desc:0 "The smallest of the Natives, the Hopi were not nearly as lucky as their fellow natives in reclaiming their old land. Still, being surrounded by the Navajo has helped protect them from most conflicts. Like their neighbors, they are mostly Mormon."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Navajo?oldid=3034
 ate_cd_navajo_desc:0 "The Navajo in the Southwest have generally been the most successful nation in the area, preferring to rebuild their lives after the Event in comfortable isolation around their homeland near Fort Defiance. However, they still have a warrior streak about them, and rumors have begun to spread of a possible expansion. They adopted the Mormon faith en masse thanks to their proximity to the kingdom of Deseret."
