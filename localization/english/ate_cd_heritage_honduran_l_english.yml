 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Miskito?oldid=3136
 ate_cd_miskito_desc:0 "The Miskito people are unique among the Caribbanglo cultures, in that they are largely of native, rather than African or European, descent. A long time under British rule, however, led to the use of the English language and customs, distorted by the native tongue and later Spanish colonization. The Miskito also boast the oldest known realm in the Americas, with the Kingdom of Moskitia dating back to at least 1650."
