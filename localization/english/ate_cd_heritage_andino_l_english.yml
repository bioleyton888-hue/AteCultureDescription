 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Quechua?oldid=3178
 ate_cd_quechua_desc:0 "The Quechua culture refers to the various speakers of the Quechua language. After the Event, the survivors of those groups seem to have united in a single culture, calling themselves Quechua. More of them likely survive south of the known world, in the central and southern Andes."
