 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Grangelander?oldid=3327
 ate_cd_grangelander_desc:0 "The flat farmland of the American Midwest is home to a flourishing culture of new nations. The Grangelander ethic remains close to the salt-of-the-earth attitude carried by its inhabitants since the days of the first settlers. The better settled areas in the east are Catholic, while the wilder, tribal areas in the west have a strong Trailwalker streak."
