l_english:
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Blackfoot?oldid=3014
 ate_cd_blackfoot_desc:0 "Like many Native American cultures, \"Blackfoot\" as a term encompasses a number of unique and often independent tribes, such as the Siksika, Kainai, and Piegan. Their homeland within the Great Plains lends itself well to a nomadic lifestyle, and the Blackfoot have taken to it with ease, roaming large swathes of the former states and provinces of Montana, Saskatchewan, and Alberta."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Comanche?oldid=3020
 ate_cd_comanche_desc:0 "Like most of the American Natives, the Comanche began to sweep into their old homelands once more. Despite being a relative minority, they are renowned for their riding skills and as protectors of the Catholic faith."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Crow?oldid=3025
 ate_cd_crow_desc:0 "The Crow have a long and storied history. Unfortunately, much of that history has been lost to the ages. What is remembered is their love of horses, their rivalry with the Blackfoot, Sioux, and Cheyenne tribes, and their displacement by the Americans. They seek to avenge these grudges, and to create a safe and free home for their people."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/M%C3%A9tis?oldid=2897
 ate_cd_metis_desc:0 "Born of the union between ancient French fur traders and the Cree, the Métis have their own unique culture, a sign of their diverse ancestry. A semi-nomadic people, they vie for dominion of the region with their Norse, Prairielander, and Cree neighbors. While in ancient times they were followers of the Christian faith, their new Exovedate faith has emerged in recent centuries."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Cree?oldid=3022
 ate_cd_nehiyaw_desc:0 "The Nêhiyaw, whom outsiders call the Cree, are the original people of central Canada. Harsh conditions have forced some of them to take to nomadism, like their southerly Sioux neighbors, and they have an uncomfortable relationship with the neighboring Métis. They follow Peyotism and have brought the faith to the Métis as well."
