 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Cherokee?oldid=2980
 ate_cd_cherokee_desc:0 "In spite of their centuries-long exile from their traditional homelands, the Cherokee still retain an independent culture in the area of Oklahoma, with a strong nostalgia for their old lands. They are also a people of the plains by now, known for their horse archers. The majority of the Cherokee are Catholic."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Muscogee?oldid=2987
 ate_cd_muscogee_desc:0 "Before the Europeans landed in the New World, the Muscogee (often called the Creek) inhabited much of the Deep South. European colonization and American expansion, however, drove them from their homeland, and the Trail of Tears led them to their new \"home\" in Oklahoma. Today, small populations still exist in both places, though neither is in any position to take their homeland back."
