l_english:
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Caraque%C3%B1o?oldid=3151
 ate_cd_caraqueno_desc:0 "The people of Venezuela have centered their culture around the grand city of Caracas. Venezolanos between the Paraguaná and Paria peninsulas will proudly identify themselves by the city's name."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Gocho?oldid=3142
 ate_cd_gocho_desc:0 "The Gocho are the Venezuelans who settled in the Andes, closer to Colombia. Because of this, they share many characteristics with the Colombianos, and are said to be the bridge between the two cultures."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Truenonato?oldid=3258
 ate_cd_truenonato_desc:0 "The Truenonato, or \"Thunder-born\", take their name from the nearly constant lightning storms that form at the mouth of the Catatumbo river. While the name may sound formidable, the Truenonato are a small people."
