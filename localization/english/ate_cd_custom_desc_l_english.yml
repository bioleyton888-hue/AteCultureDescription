l_english:
 # Phase 8 - the player writes their culture's description (event ate_cd.0001)
 ate_cd.0001.t:0 "The Tale of Our People"
 ate_cd.0001.desc:0 "Every people tells its own story. Write down how the [ate_cd_culture.GetCollectiveNounNoTooltip] see themselves: where they came from, what they value and what sets them apart. The field starts with their current description; rewrite it or keep it. It is shown in the culture tooltip and in the culture window."
 ate_cd.0001.a:0 "Save this description"
 ate_cd.0001.b:0 "Keep the current description"
 ate_cd_custom_desc_prompt:0 "Description: 2 to 4 sentences, up to 400 characters. Brackets, dollar signs and hashes are not allowed."
 # "Edit Description" button in the culture window (culture head only)
 ate_cd_edit_description_label:0 "Edit Description"
 ate_cd_edit_description_tt:0 "Write the description of this culture yourself, as many times as you like. It replaces the current one in the culture tooltip and in this window."
