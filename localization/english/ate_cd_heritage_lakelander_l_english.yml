l_english:
 # Written by NotATem (community spreadsheet)
 ate_cd_buckeye_desc:0 "\"Aw, hell, them Buckeyes. Don't get me wrong, they got some fine people. Lake-fearin', friendly, honest. Fans of Big Game. But you tell a Buckeye you never heard of 'em, they'll tell you their people are third best at everything. And they'll mean it, too. You know, they ain't even named after deer? Buckeye is a dadblamed nut. And that's what they are, Buckeyes. Total nuts.\" — Prospector Ervil Walker, Michigander"
 # Written by PepsiManIII (community spreadsheet)
 ate_cd_michigander_desc:0 "The stoic men and women of the Mitten have long travelled the Great Lakes that surround them. Living within the deep forests, they work metal in the ancient ways of their ancestors and fiercely defend their homes from any who would dare tread on them. Many a viking raider has wandered too far into their woods, never to return."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Chicagoan?oldid=2791
 ate_cd_chicagoan_desc:0 "Though all major cities are shells of their former selves, Chicago still stands as an important axis of power. The Catholic lands around and including the Windy City are most closely related to those in Michigan and Ontario, but are also a mélange of cultures, from the pagans to the north and east to the traditional Catholics in the west."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Motowner?oldid=2798
 ate_cd_motowner_desc:0 "The Motowner culture was conceived out of the urban sprawl of the great post-American chaos of the former Midwest. The great broken cities of Detroit and Cleveland are home to the Motowners, who often rule as an elite over the far more numerous peasantry of the surrounding Rust-lands. Most Motowners follow the Rust Cult, a religion centered around the ritualization and worship of old world machinery and architecture."
