l_english:
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Tejano?oldid=2889
 ate_cd_tejano_desc:0 "The Tejano are the product of years of American-Mexican cultural exchange. Residing mostly to the north of the Rio Grande, they have become a major contender for the throne of the Lone Star, though some have their sights set further south."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Texan?oldid=3292
 ate_cd_texan_desc:0 "Though the Lone Star State is divided among many kingdoms and cultures, the famous Texan spirit still survives. Texan culture is the more American remnant of the culture clash across the Rio Grande, known far and wide for its stubborn pride. Texans are one of many cultures swayed to Catholicism in the aftermath of the Event."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Texaner?oldid=3399
 ate_cd_texaner_desc:0 "Wedged between the Anglo-leaning Texans and the Latin-leaning Tejanos, the Texaners have traditions closer to those of the German settlers of the area. While not nearly as influential as either of their neighbors, they are not to be discounted. Small as they are, they dream of uniting Texas under a single Kaiser."
