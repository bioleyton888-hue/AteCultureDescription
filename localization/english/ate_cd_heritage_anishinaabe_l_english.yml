 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Algonquin?oldid=2909
 ate_cd_algonquin_desc:0 "The Algonquin (or Anicinàpe) inhabit the frozen interior of what was once Québec. Their tribal lords are seen as a threat to the status quo by their neighbors in Canada, with raiding parties striking the fringes of Christian society."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Ojibwe?oldid=2911
 ate_cd_ojibwe_desc:0 "The people of Western Ontario. The Ojibwe, despite some of them living much like the Algonquin, are mostly feudal, and have expanded more than their cousins, with pockets of them sometimes wandering among the Minnesotans as well. They follow various faiths, most prominently the Ursuline See."
