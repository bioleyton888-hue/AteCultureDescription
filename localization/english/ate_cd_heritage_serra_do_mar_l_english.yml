 # Written by Nico (community spreadsheet)
 ate_cd_caicara_desc:0 "Caá-içara are the Mangue fishermen from the Ribeira valley. The region was always marginal to the Paulista lords. From that shadow of indifference, the Caiçara carved out a culture and a life as a free folk."
 # Written by Nico (community spreadsheet)
 ate_cd_capixaba_desc:0 "Once the Tupi called their maize plantations Capixaba, and with time those who lived from that maize became Capixaba also. The event made the unassuming Capixaba into dutiful servants. The Bahiano Empress forged them into armies, to which the Southwest fell."
 # Written by Nico (community spreadsheet)
 ate_cd_carioca_desc:0 "The waters of Guanabara Bay still tame the pride of the Cariocas. The fall was especially difficult for them, carved by a thousand warlords, the blood-forged League, and its strife with the hinterland lords. But now that the Empire has returned its Sovereign throne to the Marvelous City, the spirit of its people stirs, and Great Rio dances once again."
