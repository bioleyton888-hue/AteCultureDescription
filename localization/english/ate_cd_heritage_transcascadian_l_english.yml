l_english:
 # Written by kuev (community spreadsheet). A ten-verse poem, joined with " / " (user's decision).
 ate_cd_doukhobor_desc:0 "\"Long before the current days in mountains of Kanada / Long before the day when God has punished us with Deluge / There has been land, our homeland Rossija, where wheat was gold / From there came we, forced out for our faith to not harm a thing / We were not broken, but made stronger in our truthful faith / We were not broken, but we have broken shackles of sin / We shall not harm, nor man or woman, as they are our friends / We shall not hide our bodies, as what's natural isn't ugly / And before us stood our hamlets and we were happy / And we shall be happy, for what the Lord has for us in store\""
 # Written by malicious_booby (community spreadsheet)
 ate_cd_cascadian_desc:0 "Named for a mountain range that defends their land from the sagebrush of the east, the Cascadians are a hardy people that live among the forests surrounding the western Columbia and its tributary, the Willamette, that provides for them a rich land made for agriculture. Though, since and perhaps before the Event they are strong believers in living in harmony with the land. Therefore, they tend to avoid taking in excess from the land and to this end they typically are matrilineal and revere the leadership of women so as to prevent the worst impulses of man."
