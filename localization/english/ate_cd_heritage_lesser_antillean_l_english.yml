 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Papiamen?oldid=3092
 ate_cd_papiamen_desc:0 "While Dutch influence in America is rare, the places where the Dutch retained control have a markedly different culture from their neighbors, even to this day. Such is the case with the Papiamen. Isolated on the Leeward Antilles, the island chain north of Venezuela, the former Dutch have taken to the sea, largely adopting a life of raiding and piracy."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Quisqueyano?oldid=3087
 ate_cd_quisqueyano_desc:0 "On the eastern side of the island of Hispaniola live the Quisqueyano people. They are a racially mixed people, and their island was the site of the first cathedral, castle, monastery, and fortress built in the Americas."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Venteux?oldid=3069
 ate_cd_venteux_desc:0 "Meaning \"windy\" or \"windswept\" in English, the Venteux people are descended from the French-speaking inhabitants of the Antilles. While centuries of isolation from the French and Haitians have made marked differences in their culture, their language is still fairly intelligible to the other Caribbean French cultures. Like most Antillais cultures, the majority of the Venteux practice Voodoo."
