l_english:
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Bermudian?oldid=3071
 ate_cd_bermudian_desc:0 "Beyond its famous triangle, the isolated Bermudians live on Bermuda and follow the Brethren faith. Due to its isolation, Bermuda is the ideal haven for pirates, so it is unsurprising that many infamous ravagers are Bermudian."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Boricua?oldid=3081
 ate_cd_boricua_desc:0 "The Boricua people live on the island of Puerto Rico. Their culture's name derives from the Taíno word Boriken, which translates to \"the great land of the valiant and noble Lord\"."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Cubano?oldid=3083
 ate_cd_cubano_desc:0 "The Cubano people, settled in the western and central parts of Cuba, have resisted invader after invader since ancient times, even breaking away from old America. No foreign yoke has ever sat easily on their shoulders, and their lords are quick to mutter that change is coming."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Haitian?oldid=3067
 ate_cd_haitian_desc:0 "Haitian is the culture of the people who live on the western side of the island of Hispaniola, where the country of Haiti stood before the Event. After the Event the Haitians remained mostly isolationist, never expanding beyond the borders of their ancient country. Some took to the sea as pirates, joining the Brethren, but the vast majority remain in Haiti, where they practice the Voodoo faith."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/West_Indian?oldid=3079
 ate_cd_west_indian_desc:0 "Descendants of the Afro-Anglo settlers of the Caribbean, these folk make their homes in Jamaica and the Bahamas. While the Rastafarian faith originated among these people, it was only followed by a minority before the End. However, after the collapse, many saw it as a sign that \"Babylon\" had fallen, and when the dust settled the faith was followed by a majority of the survivors. It is also the culture of many infamous pirates."
