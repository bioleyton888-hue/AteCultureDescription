 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Deitsch?oldid=2751
 ate_cd_deitsch_desc:0 "The Amish and Mennonite population naturally had advantages after the Event, and their descendants maintain much of their unique culture to this day. Their naming tradition is largely Old Germanic, and their kings bear the title of Kaynich. The Deitsch are the traditional power behind the Anabaptist movement, centered in their homeland of what was once Pennsylvania. They are cousins of the Plautsdeutsch."
