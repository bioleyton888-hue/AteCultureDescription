 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Ontarian?oldid=2803
 ate_cd_ontarian_desc:0 "The Anglo-Canadians of the past no longer exist, but their main offspring bears the name of their most populous province. Most of its history since the End has been one of tribal feuds, and Ontarians still eye their pagan neighbors warily. Their Anglican faith has only a limited reach, stretching from the east to the west of Lake Erie."
