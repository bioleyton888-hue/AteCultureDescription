 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Pur%C3%A9pecha?oldid=3193
 ate_cd_purhepecha_desc:0 "The P'urhépecha were at one time the greatest rivals, and the greatest threat, of the Aztec Empire. Not once did a P'urhépecha army fall to an Aztec. But when news reached their leader that their rival had surrendered to the Spanish, he swore fealty without any battle, and when a later uprising prompted the Spaniards to devastate their lands, they were reduced to a tiny corner of their empire. Now the P'urhépecha stand mighty once again."
