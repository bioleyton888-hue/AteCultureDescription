 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Llanero?oldid=3170
 ate_cd_llanero_desc:0 "Crossing the Cordillera Oriental or the Río Orinoco, or leaving the Venezuelan coast, one might think they have found an empty land, ready to be settled, farmed, and claimed. These are the Llanos, a vast plain stretching between Colombia and Venezuela, with miles and miles of open land and few jungles. Then they hear the sound of thundering hooves. An arrow flies past from a vast distance at an outrageous speed. And then the war cries of the Llanero can be heard. They are a nomadic people, led by a strong Caudillo and with riding traditions dating back to the Latin Wars of Independence. Several Caudillos roam Los Llanos, but if one were to bring the others to heel, the whole of South America would tremble..."
