l_english:
 # Written by Ok-Pair-4757 (community spreadsheet)
 ate_cd_caipira_desc:0 "The first Caipiras were the Bandeirantes: frontiersmen and explorers who set out from São Paulo in times ancient even to the antediluvians, seeking gold and slaves. Having left their semi-nomadic lifestyle and settled in Paulistânia, their subsistence agriculturalist society caused them to be seen as unsophisticated yokels for centuries. After the Event, the Caipiras have maintained their traditional festivals, horseriding, ranching, and toilsome farmwork; perhaps living on because of them."
 # Written by Nico (community spreadsheet)
 ate_cd_burajirujin_desc:0 "From the other side of the world came the Nikkei, from Léquia and Cobé. They struck soil along the Tietê and Paraná, and coffee and tea grew. Today, they reside alongside their fellow Caipiras, bound to the simple virtues of the land while preserving the ancient names and traditions of their ancestral home."
 # Written by u/Ok-Pair-4757 (community spreadsheet)
 ate_cd_candango_desc:0 "In pre-Event times, Sovereign Kubitschek envisioned a new capital standing tall in the Cerrado and shining as the crown jewel of Brazil, and so the land's downtrodden were put to work to build the 'capital of hope' and a new life for themselves within it. These workers, and soon all of Brasília's citizens, would become known as Candangos. After the city was built they never truly left, even as it fell to the barbarians in the turmoil that ended the world they once knew."
 # Written by u/Ok-Pair-4757 (community spreadsheet)
 ate_cd_goiano_desc:0 "When the gold of the mines of the Goiá people was depleted, the Goianos were abandoned by the faraway government in Rio de Janeiro, left to ranches and small towns bound to subsistence farming. When the so-called 'iron roads' once again connected them to the rest of Brazil, this people exported not only their soy, corn, and beef, but also a culture of vibrant music and ceremonies. Though those times are long gone they have never abandoned what made them known across the continent."
 # Written by u/Ok-Pair-4757 (community spreadsheet)
 ate_cd_maracaju_desc:0 "Named after the mountain range that cuts Mato Grosso do Sul in twain, these people are descendants of settlers who, in search of fertile land, had come from Araucárias, the Sudeste, or even from overseas, and are said to have lived in the shadow of forts from a long-forgotten war. In the centuries since the Event, the Maracajus have been defined by their ranching, the erva-mate that grows plentifully in their land, and the collaboration with and reverence for the Cerrado and the Pantanal, their home."
