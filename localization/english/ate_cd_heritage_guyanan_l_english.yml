 # Written by IamUpoi (community spreadsheet)
 ate_cd_sranan_desc:0 "The Sranan are a people born from many tongues and faiths. After the Event, they have emerged as a more syncretic whole, carving a vibrant maritime republic that clings to the shores of the Caribbean."
