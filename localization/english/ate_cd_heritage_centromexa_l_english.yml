 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Abaje%C3%B1o?oldid=3106
 ate_cd_abajeno_desc:0 "In the northern reaches of the Mexican heartlands live the Abajeño. Residents of the Bajío, they farm the valleys between the high mountains that separate the heartland from the northern deserts of Aztlan."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Chilango?oldid=3108
 ate_cd_chilango_desc:0 "The Chilango are found at what was once the center of Old Mexico, nestled in the eponymous Valley. What was once considered a derogatory term is now worn with pride, and people of this culture are often considered noble, zealous, and just."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Tapatio?oldid=3112
 ate_cd_tapatio_desc:0 "While the term Tapatio was originally used only for the people of Guadalajara, it eventually came to mean anyone from the general area of the city, usually anyone from Jalisco or Colima. The Tapatio are generally regarded in a favorable light by the other Mexicanos, who see them as the bastion of the faith on the Pacific."
