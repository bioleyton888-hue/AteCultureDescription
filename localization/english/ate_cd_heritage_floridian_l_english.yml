 ate_cd_sunshiner_desc:0 "The main residents of old Florida, utterly ungovernable. With personalities so extreme and irreverent they would be considered insane anywhere else in the world, they hold zero regard for titles or sacred things, treating everyone as a friend, even old enemies. They have such a total disregard for taking things seriously that in more than one reported firefight against them, they were laughing the whole time. If you can stomach the chaos, they make excellent swords for hire. — Spymaster Jonathan of the HRE"
 # Written by bioleyton (community spreadsheet)
 ate_cd_sofloano_desc:0 "Making up the second-largest demographic in Florida, the Sofloanos offer a calm, friendly contrast to their chaotic Sunshiner neighbors. They have a deep love for good food and sensual music, born from a blending of Caribbean and Sunshiner bloodlines. However, local rumors insist they have been there since before the Event even happened. — Spymaster Jonathan of the HRE"
