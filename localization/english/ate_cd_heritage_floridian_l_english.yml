 ate_cd_sunshiner_desc:0 "The [Culture.GetCollectiveNounNoTooltip] are children of the American South, a land of swamps, bayous, red hills and hurricanes. The old nation fell around them, but the storms, the stubbornness and the cooking all survived. Proud, hospitable and quick to take offense, they will feed any stranger and fight any fool."
