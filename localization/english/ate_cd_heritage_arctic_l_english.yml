 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Inuit?oldid=3036
 ate_cd_inuit_desc:0 "The Inuit are the ancient inhabitants of the cold, northerly lands of Old Canada. Isolationist and tribal, the Inuit of northeastern Labrador have turned to the sea, as their soil is not conducive to good agriculture."
