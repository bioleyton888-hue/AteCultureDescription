l_english:
 # Written by u/Pipsy_the_Penguin (community spreadsheet)
 ate_cd_gothamite_desc:0 "Proud, passionate, and plutocratic, the Gothamites are said to be descended from a hundred ancient peoples or more. Together, they melded into a single cosmopolitan culture amid the spires of the so-called sleepless city, which was once said to hold the world's fortunes in its hand before the Event. Much like their storied ancestors, they have developed a reputation as a mercantile and pugnacious folk. In fact, just about the only thing they can agree on is that theirs is the greatest city in all the world."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Beltway?oldid=3309
 ate_cd_beltway_desc:0 "Beltway is a small culture born in the DC metropolitan area, also known as the DMV (DC, Maryland, and Virginia). Arising from the pre-Event culture of the DMV, which was distinct from that of neighboring counties, the confusion after the Event led the people of the Beltway to turn to the Founding Fathers for aid. They adopt old legal terminology in their names and are the core followers of old America and the American dream: to unite the continent under a single star-spangled banner once again."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Hudsonian?oldid=3358
 ate_cd_hudsonian_desc:0 "Descendants of the people of Upstate New York. More influenced by Dutch culture than their southern brethren, they used to be Catholic and are now predominantly Anabaptist."
