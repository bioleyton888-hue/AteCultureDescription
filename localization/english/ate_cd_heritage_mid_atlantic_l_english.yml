 ate_cd_gothamite_desc:0 "Proud, passionate, and plutocratic, the Gothamites are said to be descended from a hundred ancient peoples or more. Together, they melded into a single cosmopolitan culture amid the spires of the so-called sleepless city, which was once said to hold the world's fortunes in its hand before the Event. Much like their storied ancestors, they have developed a reputation as a mercantile and pugnacious folk. In fact, just about the only thing they can agree on is that theirs is the greatest city in all the world."
