 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Trifinio?oldid=3164
 ate_cd_trifinio_desc:0 "Before the Event, the three nations of Guatemala, El Salvador, and Honduras shared many similarities. Be it in heritage, religion, culture, or simply environment, these three Central American nations have always shared a bond. Even separated, they were, and are, the Trifinio."
