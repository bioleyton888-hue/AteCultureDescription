 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Alaskan?oldid=2820
 ate_cd_alaskan_desc:0 "Much of the Alaskan panhandle has been reclaimed by the various tribes who once called it home. Yet the Alaskans, descended from the Americans who colonized the land, are still present, and a definite contender for the Alaskan coast."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Yukoner?oldid=2833
 ate_cd_yukoner_desc:0 "In the furthest northern reaches of the Old Canadian tundra, the people of the Yukon still survive. Despite the harshness of the frozen wastes and the hostility of their neighbors, the Yukoners still vie for hegemony over their former homeland."
