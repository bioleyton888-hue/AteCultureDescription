 ate_cd_yiddish_desc:0 "Jews who came to America from ancient Ashkenaz have found it to be a more hospitable place than almost anywhere else in the world. While the hardships of the Event threatened antediluvian tolerance, the Yiddish people, known for their perseverance and fierce loyalty to each other, are sure to survive for millennia to come."
