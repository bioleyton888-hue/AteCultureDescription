l_english:
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Haida?oldid=3004
 ate_cd_haida_desc:0 "The Haida are one of the indigenous peoples of the Pacific Northwest. Unlike many other peoples of the Americas, they found the Event very good for them, allowing them to take back their ancestral lands and expand their dominion along the coast. Considered both lucky shipbuilders and aggressive conquerors, they are feared by the peoples of the Pacific as the Vikings are feared in the Midwest and East. Their faith is their ancestral Raven Tales, the Xhúuyee K'iigaang."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Tlingit?oldid=3007
 ate_cd_tlingit_desc:0 "Perhaps one of the most iconic indigenous groups in the Pacific Northwest, the Tlingit have developed an identity among Canadians, Americans, and even Russian colonizers. Occupying the Alaskan Panhandle for centuries even before the Event, they came to adopt the religious and several cultural practices of those colonizers, blended with many practices of their own."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Tsimshianic?oldid=3009
 ate_cd_tsimshianic_desc:0 "The Tsimshian tribes have historically occupied the coast of the extreme south of Alaska and the surrounding British Columbia. While they originated in the lands now inhabited by the Dakelh (at least, so their oral histories claim), curses and disasters led them westward towards the coast."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Wakashan?oldid=3037
 ate_cd_wakashan_desc:0 "Rather than a unified culture, Wakashan refers to a diverse group of tribes and peoples who are united by a similar language. The Makah of Cape Alava, the Nuu-Chah-Nulth of Upper Victoria, and the Heiltsuk of Bella Bella are only a few of these groups. Under threat of subjugation (or, as some suggest, even extinction) by Haida overlords, these people have come to band closer together for their survival."
