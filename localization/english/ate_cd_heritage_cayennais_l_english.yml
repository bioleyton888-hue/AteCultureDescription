 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Cayennais?oldid=3065
 ate_cd_cayennais_desc:0 "The people of Cayenne are the oddest of the Antillais. While centuries of separation from the French caused some natural drift in language and customs, influence from the Guyanese, Sranan, and Brazilians has morphed it into something almost unrecognizable, even to the other French Caribbean cultures. And while some find solace in the familiarity of their Voodoo practices, others practice the Candomblé faith of the Amazon."
