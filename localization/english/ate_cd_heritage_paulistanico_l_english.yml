 # Written by Nico (community spreadsheet)
 ate_cd_paulista_desc:0 "The interior of São Paulo bred ruthless political masters and wrathful Bandeirantes. During the days of Coffee and Milk, they launched campaigns against the old rulers of the Empire. After the Event they would do the same, dethroning the Bahiano rulers and establishing the modern Bragança dynasty."
 # Written by Nico (community spreadsheet)
 ate_cd_paulistano_desc:0 "Paulistanos once were the motor and pride through which Brazil spun, and their city was the axis in which Brazil turned. From the beating heart of their capital, they remain in charge of one of the great centers of the world after the Event."
