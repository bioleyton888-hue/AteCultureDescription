l_english:
 # Written by 07eudaimonean (community spreadsheet)
 ate_cd_appalachian_desc:0 "Hill and Holler, Kith and Kin. Let the lowlanders have their cities and schemes: the proud folk of the Appalachian highlands know it is these simple treasures which truly matter! What is there that matters beyond the holler, save the next one? What way is there but the old way, passed down by firelight and banjo-ballad? The trees may fall, the rivers may change course, the sands may shift, but the hills: the hills never change."
 # Written by 07eudaimonean (community spreadsheet)
 ate_cd_yinzer_desc:0 "It is often said that the bones of the Yinzers are steel, that their blood is molten iron, that their lungs are bellows and hearts furnaces. Such is likely an exaggeration, but that the Yinzers are the Steelfolk is not: to traverse their many rivers is to see the fires of supposedly long-lost industry alight in their many mighty burges, to hear the singular ringing of a thousand hammers, all while their nigh-mystical metalworkers labor day in and day out to find new ways to shape and torment that one sacred ore which builds their world: steel."
 # Written by Constant-Cup-4902 (community spreadsheet)
 ate_cd_butternutter_desc:0 "The folk on the north of the Ohio were real kind to me, always ensuring the well-being of every little aspect of my spirit. Every other minute with them was another story so unique, it must've been true from the sheer absurdity of it all. Makes you wonder how they have time for all these stories if the other half of the minutes are spent on their duties. — Francis Packell, Motowner traveling merchant"
 # Written by Constant-Cup-4902 (community spreadsheet)
 ate_cd_riverlander_desc:0 "For a people so insular, Riverlanders are renowned. Everyone from the Gulf to the Lakes, the Plains to the Chesapeake all claim they have the best something, but no one dares to claim the best music. Everyone you'll ever meet knows you can't beat someone from a holler with a fiddle and some shine."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Ozark?oldid=2876
 ate_cd_ozark_desc:0 "The culture of ancient Arkansas has survived the Event and is now embodied in the Ozark peoples. Their traditional culture is still a fringe compared to the encroaching Dixie, but one suspects they shan't be extinguished any time soon. Like most West Anglos, the Ozarks are majority Catholic."
