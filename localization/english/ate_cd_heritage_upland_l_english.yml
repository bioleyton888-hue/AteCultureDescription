 # Written by 07eudaimonean (community spreadsheet)
 ate_cd_appalachian_desc:0 "Hill and Holler, Kith and Kin. Let the lowlanders have their cities and schemes: the proud folk of the Appalachian highlands know it is these four things which truly matter! What is there that matters beyond the holler, save the next one? What way is there but the old way, passed down by firelight and banjo-ballad? The trees may fall, the rivers may change course, the sands may shift, but the hills: the hills never change."
 # Written by 07eudaimonean (community spreadsheet)
 ate_cd_yinzer_desc:0 "It is often said that the bones of the Yinzers are steel, their blood is molten iron, their lungs are bellows and their hearts are furnaces. Such is likely an exaggeration, but that the Yinzers are the Steelfolk is not: to traverse their many rivers is to see the fires of supposedly long-lost industry alight in their many mighty burges, to hear the singular ringing of a thousand hammers, all while their nigh-mystical metalworkers labor day in and day out to find new ways to shape and torment that one sacred ore which builds their world: steel."
