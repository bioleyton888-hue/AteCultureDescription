 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Iroquois?oldid=2982
 ate_cd_haudenosaunee_desc:0 "Perhaps one of the most well known Native groups in the Americas, the Haudenosaunee, or Iroquois, were a major power on the continent even after the arrival of the Europeans, and allied themselves with the British against the French. This alliance would lead to their eventual decline, however, as it caused a rift in their Confederacy during the American Revolution. Treaties and private deals saw their land whittled away, until they, like so many other Native Americans, were restricted to living within the reservation system."
