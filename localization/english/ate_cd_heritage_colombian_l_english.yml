 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Chocoano?oldid=3155
 ate_cd_chocoano_desc:0 "Centered on the Pacific coast of old Colombia, the Chocoano people are known for their unique traditions. Due to the dense jungles between the ocean and the Cordillera Occidental, most settlements are confined to the coast, with the port city of Buenaventura being one of the largest known settlements."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Coste%C3%B1o?oldid=3159
 ate_cd_costeno_desc:0 "Centered around the great city of Cartagena, the Costeño people are spread along the Colombian Atlantic coast and the Río Magdalena. They have a reputation as shrewd merchants and charismatic personalities, whether deserved or not."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Paisa?oldid=3144
 ate_cd_paisa_desc:0 "Where the Río Magdalena and Río Cauca converge begins the Paisa region, and thus, the Paisa people. Nestled between the Cordillera Occidental and the Cordillera Central, the Paisa are largely isolated from the rest of Colombia, and have marked differences in their language and customs as a result."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Valluno?oldid=3148
 ate_cd_valluno_desc:0 "Nestled between the Cordillera Occidental and Central, the Valluno people enjoy the protection afforded them by their mountains. Their relatively small populace, however, leaves them vulnerable to subjugation. They hope their mountain forts are able to protect them from aggressive neighbors."
