 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Wayuu?oldid=3259
 ate_cd_wayuu_desc:0 "Along the coast of the Guajira peninsula reside the Wayuu, a branch of the first indigenous people to come into contact with the Europeans. While this contact did not end particularly well for them, they survived for the next millennium. The Wayuu were early adopters of European weapons, and gave no end of trouble to their colonial overlords. Today, they still run the risk of subjugation, but stand on much more even footing."
