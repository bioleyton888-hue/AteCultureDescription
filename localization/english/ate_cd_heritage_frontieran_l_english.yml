 # Written by Edward (community spreadsheet)
 ate_cd_utahn_desc:0 "Utahns are a people defined by their faith. They came to Utah, long before the Event, fleeing the persecution of that very faith. Some merely crossed the Great Plains, others first a great sea, to arrive there, a place they consider Zion, their home, their Promised Land. If you wish to trade with them, bring sugar. They love the stuff, and have since long before the Event. But never coffee. They shall cast you into the desert wastes if they so much as catch a whiff. — The Coloradan Trader's Almanac"
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Arixan?oldid=2880
 ate_cd_arixan_desc:0 "The Arixans are the descendants of the English-speaking people of the old states of New Mexico and Arizona. Their inhospitable environment has made them a hardy folk, adopting some of the ways of the Native Americans and nearby Mexicans. Unlike their West Anglo brethren, they are religiously divided into the northern Mormons and the southern Atomicists."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Battleborn?oldid=2956
 ate_cd_battleborn_desc:0 "In the deserts and watersheds of the Great Basin, the people have managed to eke out a humble existence. Those who recall the histories of the American Empire took inspiration from the state of Nevada, created in the midst of its greatest struggle, and so took their name: the Battleborn."
