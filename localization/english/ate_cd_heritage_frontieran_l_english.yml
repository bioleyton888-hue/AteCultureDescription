 # Written by Edward (community spreadsheet)
 ate_cd_utahn_desc:0 "Utahns are a people defined by their faith. They came to Utah, long before the Event, fleeing the persecution of that very faith. Some merely crossed the Great Plains, others first a great sea, to arrive there, a place they consider Zion, their home, their Promised Land. If you wish to trade with them, bring sugar. They love the stuff, and have since long before the Event. But never coffee. They shall cast you into the desert wastes if they so much as catch a whiff. — The Coloradan Trader's Almanac"
