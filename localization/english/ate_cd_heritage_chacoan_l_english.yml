 # Written by u/Ok-Pair-4757 (community spreadsheet)
 ate_cd_terena_desc:0 "When the sons of the people from beyond the seas settled their lands, the Terena were forced to leave; when they fought amongst themselves, the Terena were forced to pick a side; when the war was over and their home was torn asunder, the Terena were forced into servitude by the winners. Their freedom would eventually be reconquered, though every inch of it would be gained only through many cries and wounds. After the Event, the Terena are united in their commitment to never let one another fall into servitude ever again."
