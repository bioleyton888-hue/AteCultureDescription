 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Jarocho?oldid=3110
 ate_cd_jarocho_desc:0 "The Jarocho are the Mexicanos who live along the Gulf coast. Home to major cities such as Tampico, Xalapa, and Heroica Veracruz, they have a reputation as a wealthy people. The stereotypical Jarocho lives in a beach-side villa, with his own personal carriage to take him to the local iglesia."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Yucateco?oldid=3187
 ate_cd_yucateco_desc:0 "A close cousin of the Maya, the Yuca differentiate themselves with their more mixed ancestry. They practice the Neomayan faith."
