 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Bravo?oldid=3117
 ate_cd_bravo_desc:0 "The Bravo have been blessed by geography. The mighty Rio Bravo, from which they take their name, runs to their north, the great Sierra Madre Oriental forms a barrier to the west, and the Gulf acts as both a defense and a gateway to the Brazilian trade routes."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Choyero?oldid=3100
 ate_cd_choyero_desc:0 "When the Empire of California arose, the Celestial Emperor decreed that there is only one California. Yet the Choyero still live in the southern half of the Baja peninsula, and while some have adopted the Cetic philosophies, many keep to the faiths of their forefathers."
