 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Coloradan?oldid=2838
 ate_cd_coloradan_desc:0 "The natural barrier of the Rocky Mountains led to the emergence of the Coloradan culture, spread across the Continental Divide. Most Coloradans live in tribal societies, and the Catholic heresy of Neo-Gnosticism is their common belief."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Neomexicano?oldid=3104
 ate_cd_neomexicano_desc:0 "While many of the inhabitants of the former state of New Mexico were Americans, those east of the Rio Bravo (or Rio Grande, for those non-mexicanos out there) recalled their Spanish roots, falling more in line with Tejano and Norteño practices than with Arixan or Texan ones. Still, they are a minority, surrounded by those who see their ways as a threat to their own way of life."
