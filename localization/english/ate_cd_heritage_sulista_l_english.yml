 # Written by u/Reasonable_Common_46 (community spreadsheet)
 ate_cd_barriga_verde_desc:0 "Florianópolis once stood at the head of the province of Santa Catarina. Though stripped of their former power and threatened by ever-encroaching neighbors, the traders and sailors of the coastline are still some of the wealthiest among the warring states of Southern Brazil, and preserve a republican tradition that has been lost elsewhere."
 # Written by u/Reasonable_Common_46 (community spreadsheet)
 ate_cd_hunsrickisch_desc:0 "Germanic-speaking immigrants had founded and developed many settlements in Southern Brazil, only to be largely assimilated into the Portuguese-speaking majority in most urban areas. After the Event, however, their few remaining communities found themselves leading much of what their predecessors had once founded. Industrious and traditional, this stoic people once again stands tall."
 # Written by u/Ok-Pair-4757 (community spreadsheet)
 ate_cd_talian_desc:0 "It is said that in ancient times, Sovereign Pedro II brought many immigrants from a mythical land across the sea to settle empty lands and whiten the skin of Brazil's peoples. Despite a long period of assimilation, the Talians never fully abandoned what their ancestors had brought from their homeland, and, through the turmoil of the Event and the long age of rust that followed, they have held even tighter onto what brings their communities closer together."
