 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Prairielander?oldid=2842
 ate_cd_prairielander_desc:0 "The Prairielanders are the Anglo-Canadians of the prairies. They did not fare well in the isolated and cold prairies, and have been displaced by the Métis and the Sioux in much of the region. They follow the Trailwalker religion."
