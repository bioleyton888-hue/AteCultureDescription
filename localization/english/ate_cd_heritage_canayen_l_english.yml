 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Acadien?oldid=2895
 ate_cd_acadien_desc:0 "Strewn all over the Canadian Maritime lands for centuries, the often persecuted Acadien culture has survived up to and past the Event, against all odds. Their northern population is mostly pagan Occultist, but an Ursuline Acadien presence exists in southwestern Nova Scotia."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Quebecois?oldid=2901
 ate_cd_quebecois_desc:0 "Spread around the Saint Lawrence river basin, the land of Quebec forms by far the largest stronghold of French culture in North America. With their own strong Catholic tradition, the Vatican rupture drove the Quebecois back to their roots to follow the Ursuline faith, a matriarchal monastic religion based in Quebec City. They were once united under a strong kingdom that stretched as far as Detroit in 2226."
