 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Rar%C3%A1muri?oldid=3197
 ate_cd_raramuri_desc:0 "The Rarámuri (meaning \"those who run fast\", as they are famed for their running ability) are the only Native Mesoamerican group to have adopted a form of Christianity, rather than revert to the older religions. This is likely because their ancestors never truly practiced the old Aztec faith. They inhabit the rocky deserts north of the Valley of Mexico."
