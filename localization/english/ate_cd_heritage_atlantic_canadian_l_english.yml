 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Maritimer?oldid=2813
 ate_cd_maritimer_desc:0 "The people of the Maritime Provinces of Ancient Canada. True to the large presence of Celtic settlers in the land's history, they have adopted Scottish Gaelic-inspired customs. Unlike their southern cousins, they are not only Anglican, but also feudal."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Newfie?oldid=2815
 ate_cd_newfie_desc:0 "Even further north than the Maritimers live the Newfies, on the Avalon Peninsula of Newfoundland. They are an isolated people, tribal in their ways due to their home's inhospitable climate, and follow the Druidic faith."
