l_english:
 # Written by u/RedHuron (community spreadsheet)
 ate_cd_angeleno_desc:0 "Situated along the golden hills and swaying palms of Southern California, the Event did little to dim the brilliance of Socaleno culture. Here, as many communities, artists, gurus, and tales dot the land as stars fill the sky. To be Californian is to be Socaleno. To be Socaleno is to be among stars."
 # Written by u/RedHuron (community spreadsheet)
 ate_cd_bayfolk_desc:0 "To sail through the Golden Gates and enter the Bay Area is to explore California's psyche. The Bayfolk boast having the most acclaimed universities, the most productive business parks, the most radical rebels, and the most eccentric people. Indeed, few cultures have so much affluence and disparity, refinement and counterculture, and cynicism and faith concentrated in one small area."
 # Written by u/RedHuron (community spreadsheet)
 ate_cd_jeffersonian_desc:0 "Even before the Event, Jeffersonians had long considered themselves apart from their southern brethren. Chafing under the authority of Sacramento, the vanity of Los Angeles, and the elitism of San Francisco, many Jeffersonians seek to strike a different identity. One that is as firm as the redwoods, rugged as the hills, and as free as the air."
 # Written by u/RedHuron (community spreadsheet)
 ate_cd_montereyan_desc:0 "Battered by wind and wave, the Montereyan heartland is a craggy retreat from Californian politics. Many a retired official — some voluntary and many involuntary — has learned to call this place home. The result is a deeply introspective culture intimately familiar with the land's chill waters and harsh vistas."
 # Written by u/RedHuron (community spreadsheet)
 ate_cd_valleyan_desc:0 "If Socalenos are the face of California and the Bayfolk its brain, Valleyans are its beating heart. From the fields of Yuba to the halls of Sacramento, Valleyans work to supply the needs of the empire through their agriculture and governance. Whether they be farmers, technocrats, or the Eternal Living Guru, themself, every Valleyan lives in service to the empire and its peoples."
