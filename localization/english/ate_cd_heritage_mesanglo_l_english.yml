 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Garinagu?oldid=3133
 ate_cd_garinagu_desc:0 "The Garinagu have a very mixed ancestry, of native Carib, African, and European (mainly English) descent. Originally natives of Saint Vincent, they were expelled from the island by the English and fled to the coast of Honduras, where over many years they became the majority population. While they have very little Mayan ancestry, their proximity to their Mayan neighbors led them to take up the resurgent Neomayan faith."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Kriol?oldid=3138
 ate_cd_kriol_desc:0 "The Kriol people could be called the sum of all Caribbanglo culture, with European, African, Jamaican, Miskito, and native Mayan ancestry. Developed by colonial populations in Belize, the Kriol have largely kept to the coast, as the jungles further inland were difficult for colonial powers to penetrate. While the Kriol population is small, most have adopted the Rastafarian faith."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Raizal?oldid=3140
 ate_cd_raizal_desc:0 "The Raizal people are found only on San Andrés. Their small island has long lain in the path of the Brethren and their raids."
