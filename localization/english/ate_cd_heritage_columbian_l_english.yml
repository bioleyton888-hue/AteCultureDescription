 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Dakelh?oldid=2970
 ate_cd_dakelh_desc:0 "Long before Simon Fraser named the river that now bears his name, the Dakelh lived along the Lhtakoh, or \"the rivers within one another\". While they find protection in the mountains surrounding their homes, they must still defend their Keyoh from the peoples of the eastern plains and the Haida along the coast."
 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Ktunaxa?oldid=2998
 ate_cd_ktunaxa_desc:0 "The Ktunaxa people (called Kootenay by the Prairielanders and Canucks, and Kootenai by their southern neighbors) are, linguistically speaking, utterly unique on the continent, and are usually grouped with the Nez Perce or Paiute bands more for their location than any real cultural similarity. While their origins remain shrouded in mystery and myth, they dwell astride the pre-Event border of British Columbia and Alberta, in a land that now bears their name."
