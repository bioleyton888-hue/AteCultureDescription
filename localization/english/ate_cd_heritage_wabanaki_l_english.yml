 # Adapted from the After the End Fanfork Wiki (CC-BY-SA 3.0): https://after-the-end-fanfork.fandom.com/wiki/Mi%27kmaq?oldid=3063
 ate_cd_mikmaw_desc:0 "An indigenous people of the Northeast, the Mi'kmaw have long shared the lands of the Maritimers, from the Gaspé coast to Cape Breton. Hardy fishers and sailors, they have always lived as much from the sea as from the land."
